<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CANISLAB</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // ⚠️ Se decidió no seguir con la app como PWA -- esto YA NO
      // instala nada ni cachea nada. Solo sigue aquí de forma
      // TEMPORAL para que cualquier móvil que llegó a instalar la
      // versión anterior reciba la limpieza automática (public/sw.js
      // ahora se desregistra solo y borra su caché vieja). Pasado un
      // tiempo prudencial, este script y public/sw.js se pueden
      // borrar del todo sin ningún problema.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
